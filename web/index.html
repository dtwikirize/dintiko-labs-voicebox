<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Voicebox by Dintiko Labs — shape, generate, and manage expressive voices." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voicebox — Dintiko Labs</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('voicebox-ui');
          var theme = raw ? JSON.parse(raw)?.state?.theme : 'light';
          var resolved = theme === 'dark' ? 'dark' : theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : 'light';
          if (resolved === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
